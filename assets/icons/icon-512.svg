<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A1C71"/>
      <stop offset="50%" stop-color="#D76D77"/>
      <stop offset="100%" stop-color="#FFAF7B"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Apple squircle continuous background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <!-- Spatial Glass overlay -->
  <rect x="40" y="40" width="432" height="432" rx="92" fill="url(#glass)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <!-- Bookmark Ribbon & Star -->
  <path d="M192 128 C176 128 160 144 160 160 L160 384 L256 320 L352 384 L352 160 C352 144 336 128 320 128 Z" fill="#FFFFFF" fill-opacity="0.95" filter="url(#glow)"/>
  <circle cx="256" cy="220" r="28" fill="#FF5E7E" />
</svg>
